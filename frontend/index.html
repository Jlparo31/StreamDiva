<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamDiva
    </title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">


</head>
<body>

<nav>

        <div class="nav-title">
            StreamDiva
        </div>
    </div>

    <div class="nav-buttons">
        <button id="dashboardButton">Dashboard</button>
        <button id="topArtistsButton">Top Artists</button>
        <button id="topTracksButton">Top Tracks</button>
        <button id="profileButton">Profile</button>
        <div class="search-container">
            <input 
                id="searchBar" 
                type="text" 
                placeholder="Search..."
            >
        </div>
    </div>
        <a href="https://open.spotify.com" target="_blank">
            <img 
                id="spotifyLogo"
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Spotify_logo_without_text.svg/1280px-Spotify_logo_without_text.svg.png"
                alt="Spotify">
        </a>
    <div class="nav-right">

        <button id="importButton">
            Import History
        </button>
    </div>

</nav>
    <div id="views">

    <div id="dashboardView" class="view active">

        <!-- Spotify Weekly Dashboard Cards -->
<!-- Spotify Weekly Dashboard -->
<div id="spotifyDashboard">

    <!-- Left Column -->
    <div id="leftDashboard">
        <div id="welcomeSection">
            <h1 id="welcomeText">
            Welcome
            </h1>
            <h2> Here's your listening activity this week</h2>
        </div>

        <!-- Top Artist -->
        <div id="topArtistCard" class="dashboard-card">

            <h2>
                Top Artist This Week
            </h2>

            <div id="topArtistImages">
            </div>

            <h3 id="topArtist">
            </h3>

        </div>

        <!-- Top Albums -->
        <div id="topAlbumsCard" class="dashboard-card">

            <h2>
                Top Albums This Week
            </h2>

            <div id="topAlbums">
                Loading...
            </div>

        </div>

    </div>

    <!-- Right Column -->
    <div id="minutesCard" class="dashboard-card">

        <h2>
            Minutes Listened
        </h2>

        <p id="weeklyMinutes">
            Loading...
        </p>

        <h3>
            Top Songs This Week
        </h3>

        <ol id="topSongsList">
            Loading...
        </ol>

    </div>

</div>

        <!-- Recently played songs -->
        <div id="dashboardSongs">

            <h1>
                Your Recently Played Songs
            </h1>

            <div class="recently-played-controls">
                <button id="recentlyPlayedPrev" type="button">←</button>
                <button id="recentlyPlayedNext" type="button">→</button>
            </div>

            <div id="recentlyPlayed">
                Loading your Recently Played Songs...
            </div>

        </div>


</div>

</body>
