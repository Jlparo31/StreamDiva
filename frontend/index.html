<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamDiva
    </title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">


</head>
<body>

<nav>

        <div class="nav-title">
            StreamDiva
        </div>
    </div>

    <div class="nav-buttons">
        <button id="dashboardButton">Dashboard</button>
        <button id="topArtistsButton">Top Artists</button>
        <button id="topTracksButton">Top Tracks</button>
        <button id="profileButton">Profile</button>
    </div>
        <a href="https://open.spotify.com" target="_blank">
            <img 
                id="spotifyLogo"
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Spotify_logo_without_text.svg/1280px-Spotify_logo_without_text.svg.png"
                alt="Spotify">
        </a>
    </div>

</nav>


    <div id="views">

        <div id="dashboardView" class="view active">

            <div id="searchBar">
                <input 
                    type="text" 
                    id="artistSearch"
                    placeholder="Search an artist..."
                >

                <button id="searchButton">
                    Search
                </button>

            </div>

            <div id="artistResults">

            </div>

            <div id="dashboardSongs">
                
                <h1> Your Recently Played Songs</h1>
                <div id="recentlyPlayed">
                    Loading your Recently Played Songs...
                </div>

            </div>


        </div>

    </div>


</body>
